name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-opencl:
    name: Linux OpenCL (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: PoCL
            package: pocl-opencl-icd
            launcher: ""
          - runtime: Oclgrind
            package: oclgrind
            launcher: oclgrind
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison \
            clang \
            flex \
            g++ \
            libclang-dev \
            ninja-build \
            ocl-icd-opencl-dev \
            ${{ matrix.package }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPEN_SLEX_FRONTEND=CLANG
          -DOPEN_SLEX_ENABLE_OPENCL_RUNTIME_TESTS=ON
          -DOPEN_SLEX_OPENCL_RUNTIME_LAUNCHER=${{ matrix.launcher }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            flex
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPEN_SLEX_FRONTEND=LEGACY

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers-fuzz:
    name: Linux ASan/UBSan + fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bison clang flex libclang-dev ninja-build

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DOPEN_SLEX_FRONTEND=CLANG
          -DOPEN_SLEX_ENABLE_SANITIZERS=ON
          -DOPEN_SLEX_BUILD_FUZZER=ON

      - name: Build
        run: cmake --build build-sanitized

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
